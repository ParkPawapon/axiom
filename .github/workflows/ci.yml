name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend-checks:
    name: Frontend checks
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck frontend
        run: bun run typecheck

      - name: Lint frontend
        run: bun run lint

      - name: Build frontend
        run: bun run build

  rust-checks:
    name: Rust checks (${{ matrix.check_name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            check_name: macos-latest
          - os: windows-latest
            check_name: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Check Rust formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check

      - name: Check Rust backend
        run: cargo check --manifest-path src-tauri/Cargo.toml --all-targets

      - name: Lint Rust backend
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

      - name: Test Rust backend
        run: cargo test --manifest-path src-tauri/Cargo.toml --all-targets

  release-config:
    name: ${{ matrix.os }} release config dry run
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            platform: macos
          - os: windows-latest
            platform: windows

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Validate release signing gates in advisory mode
        env:
          AXIOM_RELEASE_MODE: dry-run
          AXIOM_RELEASE_PLATFORM: ${{ matrix.platform }}
        run: bun run release:verify-env

      - name: Generate platform release config
        env:
          AXIOM_RELEASE_MODE: dry-run
          AXIOM_RELEASE_PLATFORM: ${{ matrix.platform }}
        run: bun run release:config
